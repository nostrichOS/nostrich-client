# Who publishes Nostrich on Zapstore (zapstore.dev).
#
# Zapstore has no accounts: a release is a set of Nostr events signed by a key. This file is how
# the store's relay confirms that the key below speaks for this project — it fetches this file from
# the repository and checks the pubkey against the signer of the release events.
#
# The Android releases themselves are published from the app's own build, with the full listing
# metadata, screenshots and the signed APK.
